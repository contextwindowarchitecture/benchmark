[project]
name = "cwa-bench-d2"
version = "0.1.0"
description = "Domain 2 of the CWA viability benchmark: long-horizon multi-turn stability"
requires-python = ">=3.12"
dependencies = [
  "cwa-bench-d1",
]

[project.scripts]
cwabench2 = "cwabench2.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# Domain 1's harness, by path (domain-2-plan.md, 4.2): its run directory, output conventions, contract and, from P1,
# its adapters and oracles. Editable, so a change there is what Domain 2 runs with.
[tool.uv.sources]
cwa-bench-d1 = { path = "../domain1", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwabench2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
