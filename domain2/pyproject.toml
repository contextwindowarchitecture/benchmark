[project]
name = "cwa-bench-d2"
version = "0.1.0"
description = "Domain 2 of the CWA viability benchmark: long-horizon multi-turn stability"
requires-python = ">=3.12"
dependencies = [
  "cwa-bench-d1",
]

# Run as `cwabench --domain 2`: Domain 1's command finds this domain by its entry point.
[project.entry-points."cwabench.domains"]
2 = "cwabench2.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# Domain 1's harness, from the workspace (domain-2-plan.md, 4.2): its run directory, output conventions, contract and,
# from P1, its adapters and oracles. A workspace member is installed editable, so a change there is what Domain 2 runs.
[tool.uv.sources]
cwa-bench-d1 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwabench2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
