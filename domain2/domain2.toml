# Domain 2 run configuration (domain-2-plan.md, section 12). Paths are relative to this file.
#
# This build is P0 to P6: the generators (VT, FR, CC, IP and the LQ corpora), the graders, S0, the application side
# and its model-based producers, S1 (the assembly gate, and the baselines' payloads), S2 (the model's answers), S3
# (unreliability), S4 (long context), S5 (cost and latency), S6 (model in the loop) and S7 (goldens). The tables the
# later phases read (thresholds, caps, CI profiles) come with them.

[contract]
path = "../../../contextwindowarchitecture"
commit = "16de4be0534583f135a597171c927d42c87ee82c"  # the same pin as domain1.toml; moved deliberately, in its own commit
allow_dirty = false

[run]
suites = ["S0", "S1", "S2", "S3", "S5", "S7"]          # S4 and S6 with `run --suites`, until cached
families = ["vt", "fr", "cc", "ip"]
size = "pilot"                                   # pilot | recorded: which of each family's sizes a run generates
results_dir = "results/d2"
timeout_s = 60                                   # per assembly
concurrency = 8                                  # snapshots in flight, each on every adapter at once

# Domain 1's adapters and builds (domain1/.build): every CWA snapshot is assembled by each of them. The payload
# source's bytes are what S2 sends to the model; the others must match them byte for byte.
[adapters]
config = "../domain1/domain1.toml"
use = ["python", "typescript", "go", "rust"]
payload_source = "rust"

# The CWA arms (cwabench2/application/snapshots.py): history only, then plus oracle state, plus the model-based
# extractor's state instead, plus memory, plus the history pipeline, and the format control (the window baseline's
# selection in CWA's format). The conventional baselines (cwabench2/baselines/) are built by the harness.
[arms]
cwa = ["cwa-history", "cwa-state", "cwa-state-x", "cwa-memory", "cwa-pipeline", "cwa-format"]
baselines = ["concat", "truncate", "truncate-pinned", "window", "summary"]

[baselines]
window_turns = 10                                # window and summary: the turns kept verbatim
summarizer = "llm"                               # the rolling summary: the model's (llm), or Domain 1's stub
extractive_ratio = 0.4                           # the stub's share of each turn's tokens
summary_words = 150                              # the llm summary's word limit

# Every snapshot is assembled at each absolute budget and at each ratio of its own full charged count.
[budgets]
input = [8192, 16384, 32768]
ratios = [1.0, 0.5, 0.25, 0.1]
reserved_output = 1024
margin_percent = 35                              # covers estimate-utf8/v1's under-count of the route's text (R-16):
                                                 #   up to 25% (needing 33.3%) on the extractor's state of many
                                                 #   short facts, in the first clean recorded run
tokenizer = "estimate-utf8/v1"
renderer = "cwa-messages/v1"

# The application side (cwabench2/application/writers.py).
[application]
turn_seconds = 120                               # the scripted clock: one user turn every two minutes
history_turns = 10                               # memory arms: turns kept verbatim; older ones compacted into memory
memory_ttl_seconds = 86400                       # a memory expires a day after the turn it came from

# S1 · Assembly gate. Probes always run on every adapter at every budget; `frames` adds every turn.
[s1]
frames = true
timelines = true                                 # each conversation's last probe, per arm and budget

# The model S2 to S4 and S6 send payloads to (cwabench2/model/). `replay` answers from the committed cache alone and
# never calls the endpoint; `run --model llm` calls it on a cache miss and fills the cache. Every request parameter is
# part of each cache key. The omlx pilots of P3 and P4 (Qwen3.6-35B-A3B-8bit, MLX) replay at commit 12cbe73.
#
# The server: vLLM 0.31.0 on one 96 GB GPU, beside the harness (scripts/pod-setup.sh), started with
#   vllm serve Qwen/Qwen3.6-35B-A3B-FP8 --served-model-name qwen3.6-35b-a3b-fp8 --host 127.0.0.1 --port 8000
#     --max-model-len 262144 --gpu-memory-utilization 0.92 --max-num-seqs 256 --max-num-batched-tokens 16384
#     --enable-prefix-caching --enable-prompt-tokens-details --generation-config vllm
# `--generation-config vllm` keeps the model's generation_config.json from filling the sampling parameters a request
# leaves out; the requests state them anyway (extra_body), so each call records them. The batch sizes change only
# scheduling. Reached elsewhere, through a proxy, the endpoint takes `run --base-url` and a key in CWA_BENCH_MODEL_KEY.
[model]
mode = "replay"                                  # llm | replay; `run --model` overrides it
base_url = "http://127.0.0.1:8000/v1"            # vLLM beside the harness; `run --base-url` overrides it
model = "qwen3.6-35b-a3b-fp8"                    # the served name of Qwen/Qwen3.6-35B-A3B-FP8
api_key_env = "CWA_BENCH_MODEL_KEY"              # read from the environment
temperature = 0
seed = 7
max_tokens = 512                                 # the compute task's working takes up to about 240
request_timeout_s = 300
concurrency = 32                                 # requests in flight; the server takes 64 (--max-num-seqs)
cache = "model-cache"                            # committed, so replay needs no model
context_limit = 262144                           # the server's max_model_len, read from /models on 2026-10-10
producer_max_tokens = 2048                       # the extractor's and summarizer's replies; at 1,024, 9% of the
                                                 #   summarizer's replies in the pilots were cut off
seed_per_sample = true                           # sample k sends seed + k: independent draws (S3, S6), each replayable
# Server-specific request fields: thinking off, and the sampling stated in full at vLLM's neutral values (no nucleus
# or top-k cut, no penalties). The omlx pilots stated only temperature and seed.
[model.extra_body]
top_p = 1.0
top_k = -1
min_p = 0.0
presence_penalty = 0.0
frequency_penalty = 0.0
repetition_penalty = 1.0
chat_template_kwargs = { enable_thinking = false }

# S2 · Scripted conversations. Every probe in every arm at each tier, `repeats` samples at temperature 0.
[s2]
tiers = ["8192", "16384"]                        # absolute budgets from [budgets].input
repeats = 3
reference = "truncate-pinned"                    # the fair conventional arm every other arm is paired with
bootstrap_resamples = 2000
bootstrap_seed = 20261009

# S3 · Unreliability. S2's payloads again, `repeats` samples at `temperature`; A90 and U90−10 per arm.
[s3]
tiers = ["8192"]
repeats = 5
temperature = 0.7
reference = "truncate-pinned"
bootstrap_resamples = 2000
bootstrap_seed = 20261009

# S4 · Long context. The LQ family's questions ([families.lq]) over corpora of `ratios` times `budget` tokens, in each
# of `arms`, `repeats` samples at the model's temperature. The retrieval arms (rag and the CWA arms) share the
# retriever's best `candidates` chunks; `reference` is the arm the paired differences are taken from.
[s4]
arms = ["control-full", "truncate-pinned", "rag", "cwa-evidence", "cwa-reinforced"]
budget = 8192
ratios = [0.25, 1.0, 4.0, 16.0]
candidates = 64
repeats = 3
reference = "rag"
bootstrap_resamples = 2000
bootstrap_seed = 20261009

# S6 · Model in the loop. Each conversation of `families`, in each of `arms`, as `repeats` chains (one per sample) at
# `temperature`: the model's reply at each turn becomes the history. Needs [model].seed_per_sample to fork the chains.
# Run with `run --suites`; with S2 or S3 in the run, each arm is compared with the scripted result (S3's at S6's
# temperature, else S2's).
[s6]
families = ["vt"]
arms = ["truncate-pinned", "window", "summary", "cwa-history", "cwa-state", "cwa-memory"]
tier = "8192"
repeats = 3
temperature = 0.7
reference = "truncate-pinned"
bootstrap_resamples = 2000
bootstrap_seed = 20261009

# S7 · Goldens. Adopt a run's candidates with `cwabench --domain 2 goldens accept`.
[s7]
goldens = "goldens/d2-goldens.json"

# Every family generates `sizes` conversations per turn count, each with a probe after every `checkpoint_every`
# turns and after the last.
[turns]
counts = [10, 50, 100]
checkpoint_every = 10

# VT · Variable tracking (conversations/variables.py).
[families.vt]
seed = 20261009
sizes = { pilot = 2, recorded = 20 }             # conversations per turn count
variables = 3                                    # tracked chains
distractors = 2                                  # near-miss chains: a similar name, or the same entity's other figure
assignment_density = 0.5                         # the share of turns that assign a value
filler_sentences = 4                             # per user turn, beside any assignment
reply_sentences = 3                              # per assistant turn, after its acknowledgement

# FR · Facts revealed over turns (conversations/facts.py).
[families.fr]
seed = 20261010
sizes = { pilot = 2, recorded = 20 }
tasks = ["record", "compute"]                    # alternating by conversation index
fields = 6                                       # record: fields revealed, one per turn
steps = 6                                        # compute: order lines revealed, one per turn
filler_sentences = 4
reply_sentences = 3

# CC · Corrections (conversations/corrections.py): each figure stated once, then corrected by the user.
[families.cc]
seed = 20261011
sizes = { pilot = 2, recorded = 20 }
variables = 3
distractors = 2
corrections = 2                                  # the most corrections per tracked figure
filler_sentences = 4
reply_sentences = 3

# IP · Instruction persistence (conversations/persistence.py): VT with a rule in the instructions.
[families.ip]
seed = 20261012
sizes = { pilot = 3, recorded = 21 }             # three conversations per turn count: one per rule at pilot size
variables = 3
distractors = 2
assignment_density = 0.5
filler_sentences = 4
reply_sentences = 3
rules = ["brackets", "signoff", "uppercase"]

# LQ · Long-context question answering (conversations/longcontext.py): corpora, not conversations, asked by S4 only.
# `sizes` are corpora per ratio of [s4]; each has one question of each kind and format unless `questions` names some.
[families.lq]
seed = 20261013
sizes = { pilot = 2, recorded = 10 }
chunk_tokens = 128                               # a chunk's most tokens; Domain 1's chunker cuts at sentences

# Where findings were reported, by finding id (schemas/upstream.v1.schema.json). Kept by hand; optional.
[findings]
upstream = "findings/upstream.json"
