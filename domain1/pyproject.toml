[project]
name = "cwa-bench-d1"
version = "0.1.0"
description = "Domain 1 of the CWA viability benchmark: assembly determinism, budgeting and traceability"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
]

[project.scripts]
cwabench = "cwabench.cli:main"

# Every domain registers its command here; `cwabench --domain 1` is the same as plain `cwabench`.
[project.entry-points."cwabench.domains"]
1 = "cwabench.cli:run_domain1"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwabench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
