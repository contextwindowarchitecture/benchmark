[project]
name = "cwa-bench-d1"
version = "0.1.0"
description = "Domain 1 of the CWA viability benchmark: assembly determinism, budgeting and traceability"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
]

[project.scripts]
cwabench = "cwabench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwabench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
