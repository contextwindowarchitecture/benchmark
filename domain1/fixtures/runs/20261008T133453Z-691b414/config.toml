# Domain 1 run configuration (domain-1-plan.md, section 13).
#
# Paths are relative to this file. Commands, environments and paths may use three placeholders:
#   {root}      this directory
#   {build}     {root}/.build, where the harness keeps everything it builds
#   {checkout}  the adapter's checkout
# Builds run in the checkout but write their output under {build}, so the assembler checkouts are not modified.

[contract]
path = "../../../contextwindowarchitecture"
commit = "16de4be0534583f135a597171c927d42c87ee82c"  # the run stops if the checkout is at another commit
allow_dirty = false

[run]
suites = ["S0", "S1", "S2", "S4", "S5", "S6", "S7", "S8", "S9", "S10", "S11", "S12"]
adapters = ["python", "typescript", "go", "rust"]
timeout_s = 60
concurrency = 8
results_dir = "results/d1"

[adapters.python]
language = "Python"
checkout = "../../../assembler-python"
build = [["uv", "sync", "--frozen", "--no-dev", "--project", "{checkout}"]]
build_env = { UV_PROJECT_ENVIRONMENT = "{build}/python-venv" }
command = ["{build}/python-venv/bin/python", "{root}/adapters/python_adapter.py"]
toolchain = ["{build}/python-venv/bin/python", "--version"]
# S7's in-process timing loop (plan 8.3, method 3): adapters/timing/, built against the checkout without modifying it.
timing = { command = ["{build}/python-venv/bin/python", "{root}/adapters/timing/python_timing.py"] }

[adapters.typescript]
language = "TypeScript"
checkout = "../../../assembler-typescript"
# Compiled from the checkout's src/ into {build}, so a run tests the checked-out source rather than whatever dist/
# was last built. The compiled code resolves its dependencies through the linked node_modules; the checkout needs
# `pnpm install` once.
requires = ["{checkout}/node_modules/.bin/tsc"]
links = { "{build}/typescript/node_modules" = "{checkout}/node_modules" }
build = [["{checkout}/node_modules/.bin/tsc", "-p", "{checkout}/tsconfig.json", "--outDir", "{build}/typescript/dist"]]
command = ["node", "{root}/adapters/typescript_adapter.mjs"]
env = { CWA_TS_ASSEMBLER = "{build}/typescript/dist/index.js" }
toolchain = ["node", "--version"]
timing = { command = ["node", "{root}/adapters/timing/typescript_timing.mjs"] }

[adapters.go]
language = "Go"
checkout = "../../../assembler-go"
build = [["go", "build", "-o", "{build}/bin/cwa-adapter-go", "./cmd/adapter"]]
command = ["{build}/bin/cwa-adapter-go"]
toolchain = ["go", "version"]
[adapters.go.timing]
# `go build -overlay` adds cmd/cwabench-timing to the checkout's module for this build only.
templates = { "{build}/timing/go/overlay.json" = "{root}/adapters/timing/go/overlay.json.in" }
build = [["go", "build", "-overlay", "{build}/timing/go/overlay.json", "-o", "{build}/bin/cwa-timing-go",
          "./cmd/cwabench-timing"]]
command = ["{build}/bin/cwa-timing-go"]

[adapters.rust]
language = "Rust"
checkout = "../../../assembler-rust"
build = [["cargo", "build", "--release", "--locked", "--example", "adapter"]]
build_env = { CARGO_TARGET_DIR = "{build}/rust-target" }
command = ["{build}/rust-target/release/examples/adapter"]
toolchain = ["rustc", "--version"]
[adapters.rust.timing]
# A crate of its own under {build}, with the checkout as a path dependency and the checkout's lock file.
templates = { "{build}/timing/rust/Cargo.toml" = "{root}/adapters/timing/rust/Cargo.toml.in" }
copies = { "{build}/timing/rust/Cargo.lock" = "{checkout}/Cargo.lock" }
build = [["cargo", "build", "--release", "--offline", "--manifest-path", "{build}/timing/rust/Cargo.toml"]]
build_env = { CARGO_TARGET_DIR = "{build}/rust-target" }
command = ["{build}/rust-target/release/cwabench-timing"]

# S2 · Repeatability across environments. Every snapshot runs `repetitions` times in the host's own environment and
# `cell_repetitions` times in each other cell; the Linux container adds its own baseline and clock-shift cells.
[s2]
corpus = ["conformance", "producer.off", "producer.stub"]   # producer.*: S11's frozen output, no model
repetitions = 10
cell_repetitions = 2
linux_repetitions = 3
cells = ["baseline", "tz:UTC", "tz:Pacific/Kiritimati", "tz:America/St_Johns", "tz:Asia/Kathmandu",
         "locale:C", "locale:en_US.UTF-8", "locale:tr_TR.UTF-8", "locale:ja_JP.UTF-8", "threads:1", "threads:16",
         "env:minimal", "home:unset", "cwd:empty", "burst:32"]
container = true

# S6 · Admission and pipeline; S8 · Refusal, degraded evidence and fitting; S9 · Conflicts. Labeled corpora: each
# snapshot carries every decision its trace must record (cwabench/corpora/labeled).
[s6]
corpus = ["labeled.admission", "labeled.boundaries", "labeled.precedence", "labeled.pipeline"]

[s8]
corpus = ["labeled.refusal", "labeled.degradation", "labeled.fitting"]

[s9]
corpus = ["labeled.conflicts"]

# S4 · Metamorphic relations MR1–MR14. Seeds are sampled from each corpus; every relation makes its instances from a
# seed and the reference adapter's answer on it, and each adapter is judged against its own answer on the base.
# MR13 (budget monotonicity) is triaged, never failed.
[s4]
corpus = ["labeled.admission", "labeled.boundaries", "labeled.precedence", "labeled.pipeline", "labeled.conflicts",
          "labeled.refusal", "labeled.degradation", "labeled.fitting", "fuzz.seeds"]
seeds_per_corpus = 40
reference = "python"
max_tests = 150          # minimizer test budget per finding

# S5 · Generative fuzzing. Valid snapshots in rounds, steered between rounds toward coverage tags no trace has shown;
# then mutants that each break exactly one snapshot check. seed, valid and mutated reproduce the corpora byte for byte
# (given the same answers, which steering reads). CI smoke: valid = 500, mutated = 100.
[s5]
seed = 20261006
valid = 10000
mutated = 2000
round = 1000
max_tests = 200          # minimizer test budget per finding

# S7 · Budget pressure at scale (plan 7.7 and section 8). corpora/scale.py builds each cell from its shape, candidates
# and candidate tokens; every budget's outcome and refusal code is computed by the harness before any adapter runs.
# Within an adapter, shape and budget, cells run from the least work (candidates × tokens) up, and every cell with at
# least the work of one that timed out is skipped. Performance is measured serially afterwards, on three series per
# shape: more candidates at perf_fixed_tokens, more tokens at perf_fixed_candidates, and both together at
# perf_tokens_per_candidate, each fitted to a log-log slope.
[s7]
timeout_s = 30                                   # per call; a timeout is a performance finding (warning)
candidates = [10, 100, 500, 1000, 5000, 10000]
candidate_tokens = [10000, 100000, 500000, 2000000]
budget_ratio = [1.0, 0.5, 0.25, 0.1, 0.01]
below_threshold = true                           # also one token below the protected-only charged count
components_cell = [500, 100000]                  # every tokenizer × renderer at this size
components_ratio = [1.0, 0.5, 0.1]
window_cell = [1000, 500000]                     # the viability doc's 500k → 128k case, at fixed windows
window_shapes = ["compressible-v1"]
windows = [8192, 32768, 131072, 200000, 1000000]
threshold_cells = [[100, 10000], [1000, 20000]]  # binary search for the smallest budget that assembles
sweep_cell = [40, 2000]                          # budget sweeps, refined to exact single-token boundaries
sweep_step_percent = 2
perf = true
perf_candidates = [50, 100, 200, 400]
perf_tokens_per_candidate = 250                  # the diagonal series: (n, 250 n)
perf_fixed_tokens = 50000                        # the candidates series: (n, 50000)
perf_fixed_candidates = 100                      # the tokens series: (100, 250 n)
perf_labels = ["ratio:1.0", "ratio:0.1", "threshold-1"]
perf_min_samples = 10                            # 3 once a sample takes over a second, and never fewer
perf_max_samples = 30
perf_max_seconds = 4                             # per cell and method, once 3 samples are taken
perf_ci_target = 0.05                            # 95% CI half-width as a fraction of the mean
inprocess = true
throughput_cell = [100, 10000]
throughput_invocations = 32
max_tests = 100                                  # minimizer test budget per finding

# S10 · Purity and isolation: the macOS no-network sandbox and the isolated Linux container, with strace.
[s10]
corpus = ["conformance", "producer.off", "producer.stub"]
macos_sandbox = true

# S11 · Producer pipeline and the optional LLM summarizer (plan 7.11 and section 9). A synthetic corpus is chunked into
# evidence items and frozen per arm: off (no variants), stub (lead-N, first-sentence, extractive) and, in llm or replay
# mode, llm (the summarizer's). Each arm's snapshot is swept from its full size to refusal on every adapter. The model is
# called only before freeze: in llm mode a cache miss calls base_url and fills the cache; in replay mode a miss is an
# error, so CI needs no model. The summarizer's own measures (fidelity, repeat stability, flip rate, cache) never gate.
[summarizer]
mode = "stub"                                    # off | stub | llm | replay; `run --summarizer` overrides it
base_url = "http://127.0.0.1:8000/v1"            # any OpenAI-compatible server
model = "Qwen3.6-35B-A3B-8bit"                   # the model the committed cache was filled with
api_key_env = "CWA_BENCH_SUMMARIZER_KEY"         # read from the environment; empty for a local server
temperature = 0
seed = 7                                         # sent when set; part of every cache key
max_tokens = 400
extra_body = { chat_template_kwargs = { enable_thinking = false } }  # server-specific request fields
request_timeout_s = 120
concurrency = 2                                  # summarizer requests in flight
cache = "summarizer-cache"                       # content-addressed; commit it to replay an LLM corpus in CI
target_ratio = 0.35                              # the summary's word target as a fraction of the parent's tokens
repeat_k = 5                                     # samples per chunk: repeat stability and the decision flip rate
judge = false                                    # LLM-as-judge faithfulness: reported, never gating
corpus_seed = 20261006                           # the synthetic corpus and its relevance scores
documents = 6
chunk_tokens = 110
lead_words = 24
extractive_ratio = 0.4
fidelity_band = [0.05, 0.85]                     # variant tokens ÷ parent tokens
sweep_step_percent = 2
determinism_ratios = [1.0, 0.6, 0.3, 0.1]        # budgets where every adapter answers again, determinism_repeats times
determinism_repeats = 3
flip_ratios = [0.8, 0.6, 0.4, 0.2]               # budgets where every sample's snapshot is assembled

# S12 · Consensus goldens. Adopt a run's candidates with `cwabench goldens accept`; nothing adopts them automatically.
[s12]
goldens = "goldens/d1-goldens.json"

# The Linux container S2 and S10 use (container/Containerfile). The image is rebuilt only when its inputs change.
[container]
enabled = true
engine = "podman"
[container.images]
go = "docker.io/library/golang:1.27-trixie"
rust = "docker.io/library/rust:1.99-trixie"
node = "docker.io/library/node:24-trixie-slim"
python = "docker.io/library/python:3.14-slim-trixie"
uv = "ghcr.io/astral-sh/uv:0.12"

# S2's platform and toolchain matrix (plan 7.2): each variant builds the same Containerfile for another platform, or
# with one toolchain swapped for its floor. `[s2] matrix` (or a CI profile's s2_matrix) names the ones to run. The
# floors are what the assemblers declare: Python >=3.11 (pyproject), Node >=22 (engines), Go 1.26 (go.mod) and Rust
# 1.80 (rust-version; there is no trixie image for it, and a bookworm binary runs on the trixie final stage).
[container.variants.amd64]
platform = "linux/amd64"
description = "Linux x86_64 (emulated on an arm64 host)"
[container.variants."python-3.11"]
images = { python = "docker.io/library/python:3.11-slim-trixie" }
description = "Python 3.11, the floor assembler-python declares"
[container.variants."python-3.12"]
images = { python = "docker.io/library/python:3.12-slim-trixie" }
description = "Python 3.12"
[container.variants."python-3.13"]
images = { python = "docker.io/library/python:3.13-slim-trixie" }
description = "Python 3.13"
[container.variants."node-22"]
images = { node = "docker.io/library/node:22-trixie-slim" }
description = "Node 22, the floor assembler-typescript declares"
[container.variants."go-1.26"]
images = { go = "docker.io/library/golang:1.26-trixie" }
description = "Go 1.26, the previous release and assembler-go's go.mod floor"
[container.variants."rust-1.80"]
images = { rust = "docker.io/library/rust:1.80-bookworm" }
description = "Rust 1.80, assembler-rust's declared MSRV"

# P7 · CI profiles: `cwabench ci <profile> [--fetch | --checkouts DIR]` (cwabench/ci.py). Each run writes ci.json, a
# drift report against the previous run of the same profile, and is published as results/d1/<profile>. Nothing
# schedules these yet: run them by hand, or from the manual GitHub workflow (.github/workflows/domain1-ci.yml).
[ci.profiles.nightly]
description = "Every suite but S7, with the full platform and toolchain matrix; S11 replays the committed LLM cache"
suites = ["S0", "S1", "S2", "S4", "S5", "S6", "S8", "S9", "S10", "S11", "S12"]
s2_matrix = ["amd64", "python-3.11", "python-3.12", "python-3.13", "node-22", "go-1.26", "rust-1.80"]
summarizer = "replay"

[ci.profiles.weekly]
description = "Every suite, S7's scale grid and performance phase included"
suites = ["S0", "S1", "S2", "S4", "S5", "S6", "S7", "S8", "S9", "S10", "S11", "S12"]
s2_matrix = ["amd64", "python-3.11", "python-3.12", "python-3.13", "node-22", "go-1.26", "rust-1.80"]
summarizer = "replay"

# Run in a mirror after `--fetch` checks it out, by role ("contract" or an adapter's name).
[ci.prepare]
typescript = [["pnpm", "install", "--frozen-lockfile"]]
